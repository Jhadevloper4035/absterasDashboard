<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absteras Company CRM</title>

  <style>
    html, body {
      margin: 0;
      background: #282f36;
    }

    #splash-screen {
      position: fixed;
      top: 50%;
      left: 50%;
      background: #282f36;
      display: flex;
      height: 100%;
      width: 100%;
      transform: translate(-50%, -50%);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      overflow: hidden;
    }

    #splash-screen::after {
      content: '';
      width: 36px;
      height: 36px;
      border: 4px solid rgba(42, 133, 255, 0.25);
      border-top-color: #2a85ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    #splash-screen.remove {
      animation: fadeout 0.2s forwards;
      z-index: 0;
    }

    @keyframes fadeout {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

  </style>

</head>

<body>
  <div id="root"></div>
  <div id="splash-screen" aria-label="Loading"></div>
  <script type="module" src="/src/main"></script>
  <script>
    const rootEl = document.querySelector('#root')
    new MutationObserver(() => {
      document.querySelector('#splash-screen')?.classList.add('remove');
    }).observe(rootEl, { childList: true });
  </script>
</body>

</html>
