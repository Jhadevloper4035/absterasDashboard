services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    env_file:
      - ./backend/.env.production
    expose:
      - "4000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    expose:
      - "8080"
    depends_on:
      - backend
    restart: unless-stopped
