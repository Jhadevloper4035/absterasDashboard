services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    env_file:
      - ./.env
    expose:
      - "4000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    expose:
      - "8080"
    depends_on:
      - backend
    restart: unless-stopped
