services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    env_file:
      - ./.env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - redis
    restart: unless-stopped

  email-worker:
    image: ${BACKEND_IMAGE}
    command: npm run worker
    env_file:
      - ./.env
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
