name: Deploy EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend checks
        working-directory: backend
        env:
          NODE_ENV: test
          AUTH_SECRET: test-secret-012345678901234567890123
          MONGODB_URI: mongodb://127.0.0.1:27017/absteras_test
        run: |
          npm ci
          npm test
          npm run check
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    env:
      BACKEND_IMAGE_REPO: ${{ secrets.DOCKER_IMAGE_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/absteras-crm-backend
      FRONTEND_IMAGE_REPO: ${{ secrets.DOCKER_IMAGE_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/absteras-crm-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker secrets
        run: |
          test -n "${{ secrets.DOCKERHUB_USERNAME }}"
          test -n "${{ secrets.DOCKERHUB_TOKEN }}"
          test -n "$BACKEND_IMAGE_REPO"
          test -n "$FRONTEND_IMAGE_REPO"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_REPO }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE_REPO }}:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          target: prod
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE_REPO }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE_REPO }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    env:
      APP_DIR: ${{ secrets.EC2_APP_DIR || '/opt/absteras-crm' }}
      BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
      BACKEND_IMAGE: ${{ secrets.DOCKER_IMAGE_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/absteras-crm-backend:${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_USER: ${{ secrets.EC2_USER }}
      FRONTEND_IMAGE: ${{ secrets.DOCKER_IMAGE_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/absteras-crm-frontend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          echo "Checking required inputs..."
          missing=0
          for var in EC2_HOST EC2_USER EC2_SSH_KEY BACKEND_ENV BACKEND_IMAGE FRONTEND_IMAGE; do
            if [ -z "${!var}" ]; then
              echo "ERROR: \$$var is empty"
              missing=1
            else
              echo "OK: \$$var is set"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more required env vars are missing. Aborting."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Package deploy files
        run: |
          tar -czf /tmp/absteras-crm-deploy.tar.gz docker-compose.prod.yml deploy/nginx.conf

      - name: Copy deploy files to EC2
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "mkdir -p '$APP_DIR'"
          scp -i ~/.ssh/ec2_key /tmp/absteras-crm-deploy.tar.gz "$EC2_USER@$EC2_HOST:/tmp/absteras-crm-deploy.tar.gz"
          printf '%s\n' "$BACKEND_ENV" | ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "cat > '$APP_DIR/.env'"

      - name: Login to Docker Hub on EC2
        run: |
          printf '%s\n' "$DOCKERHUB_TOKEN" | ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Pull images and restart app
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "
            set -e
            cd '$APP_DIR'

            if [ -f docker-compose.prod.yml ]; then
              echo 'Stopping current containers'
              docker compose -f docker-compose.prod.yml down --remove-orphans || true
            fi

            echo 'Cleaning stale app files'
            find '$APP_DIR' -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf {} +
            tar -xzf /tmp/absteras-crm-deploy.tar.gz -C '$APP_DIR'
            printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' '$BACKEND_IMAGE' '$FRONTEND_IMAGE' >> '$APP_DIR/.env'

            echo 'Pulling new images'
            docker compose -f docker-compose.prod.yml pull

            echo 'Starting new containers'
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            echo 'Cleaning old docker images'
            docker image prune -af
          "

      - name: Health check
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "
            set -e
            echo 'Waiting for backend to become healthy'
            for i in \$(seq 1 15); do
              if curl -kfsS https://localhost/health >/dev/null 2>&1; then
                echo 'Backend healthy'
                exit 0
              fi
              echo \"Attempt \$i/15 failed, retrying in 5s...\"
              sleep 5
            done
            echo 'Backend failed health check after deploy'
            cd '$APP_DIR'
            docker compose -f docker-compose.prod.yml logs --tail=100
            exit 1
          "
