upstream crm_frontend {
  server frontend:8080;
}

upstream crm_backend {
  server backend:4000;
}

server {
  listen 80;
  server_name crm.absteras.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name crm.absteras.com;
  client_max_body_size 25m;

  ssl_certificate /etc/letsencrypt/live/crm.absteras.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/crm.absteras.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  location /api/ {
    proxy_pass http://crm_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://crm_backend;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://crm_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
